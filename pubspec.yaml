name: mariage_app
description: Application de partage photo et vidéo du mariage Emmanuel & Jennifer.
publish_to: 'none'
version: 1.3.1+5

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.12.0
  shared_preferences: ^2.5.5
  workmanager: 0.10.10
  http: ^1.6.0
  http_parser: ^4.1.2
  file_picker: 10.3.10
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/wedding/rose_top.webp
    - assets/wedding/rose_bottom.webp
