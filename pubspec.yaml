name: mariage_app
description: Application de partage photo et vidéo du mariage Emmanuel & Jennifer.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.12.0
  shared_preferences: ^2.5.5
  workmanager: 0.9.0+3
  http: ^1.6.0
  http_parser: ^4.1.2

dependency_overrides:
  workmanager_android: 0.9.0+3
  workmanager_apple: 0.9.1+2
  workmanager_platform_interface: 0.9.1+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
