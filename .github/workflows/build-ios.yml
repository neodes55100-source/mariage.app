name: Build iOS unsigned

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native projects
        run: flutter create --project-name mariage_app --org fr.creemachanson --platforms android,ios .
      - name: Patch permissions and app metadata
        run: bash tool/patch_native.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r Mariage-iOS-unsigned.ipa Payload
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: Mariage-iOS-unsigned
          path: Mariage-iOS-unsigned.ipa
