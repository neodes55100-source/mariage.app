name: Build iOS unsigned

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native projects
        run: flutter create --project-name mariage_app --org fr.creemachanson --platforms android,ios .
      - name: Patch permissions and app metadata
        run: bash tool/patch_native.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Patch FilePicker for Xcode 26
        shell: bash
        run: |
          PICKER_FILE="$(find "$HOME/.pub-cache/hosted/pub.dev" -path '*/file_picker-10.3.10/ios/file_picker/Sources/file_picker/FilePickerDelegate.swift' -print -quit)"
          if [ -z "$PICKER_FILE" ]; then
            echo "FilePickerDelegate.swift introuvable"
            exit 1
          fi
          python3 - "$PICKER_FILE" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          text = re.sub(r'(?<!Foundation\.)\bFileManager\b', 'Foundation.FileManager', text)
          path.write_text(text)
          print(f"Patched: {path}")
          PY
      - name: Prepare iOS project
        run: flutter build ios --release --config-only --no-codesign
      - name: Build iOS app without signing
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_unsigned \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build
          mkdir -p build/ios/iphoneos
          cp -R build/ios_unsigned/Build/Products/Release-iphoneos/Runner.app build/ios/iphoneos/
      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r Mariage-iOS-unsigned.ipa Payload
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: Mariage-iOS-unsigned
          path: Mariage-iOS-unsigned.ipa
