name: Build iOS unsigned

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native projects
        run: flutter create --project-name mariage_app --org fr.creemachanson --platforms android,ios .
      - name: Patch permissions and app metadata
        run: bash tool/patch_native.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Patch FilePicker for Xcode 26
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          config_path = Path('.dart_tool/package_config.json').resolve()
          config = json.loads(config_path.read_text())
          packages = [
              package for package in config.get('packages', [])
              if package.get('name', '').startswith('file_picker')
          ]

          if not packages:
              raise SystemExit('FilePicker absent du package_config')

          swift_files = []
          for package in packages:
              root_uri = package.get('rootUri', '')
              parsed = urlparse(root_uri)
              if parsed.scheme == 'file':
                  root = Path(unquote(parsed.path))
              else:
                  root = (config_path.parent / unquote(root_uri)).resolve()
              if root.exists():
                  swift_files.extend(root.rglob('*.swift'))

          changed = 0
          for path in swift_files:
              text = path.read_text()
              patched = re.sub(
                  r'(?<!Foundation\.)\bFileManager\b',
                  'Foundation.FileManager',
                  text,
              )
              if patched != text:
                  path.write_text(patched)
                  changed += 1
                  print(f'Patched: {path}')

          print(f'FilePicker Swift files found: {len(swift_files)}; patched: {changed}')
          PY
      - name: Prepare iOS project
        run: flutter build ios --release --config-only --no-codesign
      - name: Build iOS app without signing
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_unsigned \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build
          mkdir -p build/ios/iphoneos
          cp -R build/ios_unsigned/Build/Products/Release-iphoneos/Runner.app build/ios/iphoneos/
      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r Mariage-iOS-unsigned.ipa Payload
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: Mariage-iOS-unsigned
          path: Mariage-iOS-unsigned.ipa
